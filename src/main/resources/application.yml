spring:
  application:
    name: Blogging-app

  datasource:
    url: jdbc:mysql://localhost:3306/bloggingDb
    username: root
    password: Root@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


project:
  image: images/

logging:
  level:
    org:
      springframework:
        security: DEBUG



